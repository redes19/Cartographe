services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - modules:/app/node_modules
    environment:
      VITE_POLLING: ${VITE_POLLING:-false}
    stdin_open: true
    tty: true

volumes:
  modules:
